<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程助教小程序 - 预览版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            line-height: 1.6;
        }

        .phone-container {
            max-width: 375px;
            margin: 20px auto;
            background: white;
            min-height: 667px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            background: #333;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 14px;
        }

        .nav-bar {
            display: flex;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 500;
        }

        .nav-back {
            font-size: 18px;
            width: 30px;
        }

        .nav-title {
            flex: 1;
            font-size: 18px;
        }

        .nav-more {
            width: 30px;
        }

        .content {
            padding: 20px;
            min-height: calc(667px - 120px);
            overflow-y: auto;
        }

        .home-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            display: block;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
        }

        .quick-actions {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .action-item {
            text-align: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .action-item:hover {
            opacity: 0.8;
        }

        .action-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 24px;
        }

        .action-text {
            font-size: 12px;
            color: #333;
        }

        .recent-list {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-icon {
            width: 40px;
            height: 40px;
            background: #f0f8ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
        }

        .list-content {
            flex: 1;
        }

        .list-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 4px;
        }

        .list-desc {
            font-size: 12px;
            color: #999;
        }

        .list-time {
            font-size: 12px;
            color: #666;
        }

        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            border-top: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .tab-item.active {
            color: #667eea;
        }

        .tab-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .tab-text {
            font-size: 12px;
        }

        .demo-note {
            text-align: center;
            margin: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            color: #856404;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="demo-note">
        💡 这是微信小程序的HTML预览版本，用于展示界面效果
    </div>

    <div class="phone-container">
        <!-- 状态栏 -->
        <div class="status-bar">9:41 AM</div>
        
        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-back">‹</div>
            <div class="nav-title">课程助教</div>
            <div class="nav-more">⋯</div>
        </div>

        <!-- 内容区域 -->
        <div class="content">
            <!-- 数据统计 -->
            <div class="home-stats">
                <div class="stat-card">
                    <span class="stat-number">5</span>
                    <span class="stat-label">课程数量</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">120</span>
                    <span class="stat-label">学生总数</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">25</span>
                    <span class="stat-label">作业数量</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">8</span>
                    <span class="stat-label">待处理事项</span>
                </div>
            </div>

            <!-- 快捷操作 -->
            <div class="quick-actions">
                <div class="section-title">快捷操作</div>
                <div class="action-grid">
                    <div class="action-item">
                        <div class="action-icon">📚</div>
                        <div class="action-text">课程管理</div>
                    </div>
                    <div class="action-item">
                        <div class="action-icon">👥</div>
                        <div class="action-text">学生管理</div>
                    </div>
                    <div class="action-item">
                        <div class="action-icon">📝</div>
                        <div class="action-text">作业发布</div>
                    </div>
                    <div class="action-item">
                        <div class="action-icon">📊</div>
                        <div class="action-text">成绩统计</div>
                    </div>
                </div>
            </div>

            <!-- 最近动态 -->
            <div class="recent-list">
                <div class="section-title">最近动态</div>
                <div class="list-item">
                    <div class="list-icon">📋</div>
                    <div class="list-content">
                        <div class="list-title">高等数学期中考试</div>
                        <div class="list-desc">35名学生已提交</div>
                    </div>
                    <div class="list-time">2小时前</div>
                </div>
                <div class="list-item">
                    <div class="list-icon">📢</div>
                    <div class="list-content">
                        <div class="list-title">课程通知</div>
                        <div class="list-desc">下周二实验室课程调整</div>
                    </div>
                    <div class="list-time">4小时前</div>
                </div>
                <div class="list-item">
                    <div class="list-icon">✅</div>
                    <div class="list-content">
                        <div class="list-title">作业批改完成</div>
                        <div class="list-desc">计算机科学基础作业1</div>
                    </div>
                    <div class="list-time">昨天</div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="tab-bar">
            <div class="tab-item active">
                <div class="tab-icon">🏠</div>
                <div class="tab-text">首页</div>
            </div>
            <div class="tab-item">
                <div class="tab-icon">📚</div>
                <div class="tab-text">课程</div>
            </div>
            <div class="tab-item">
                <div class="tab-icon">📝</div>
                <div class="tab-text">作业</div>
            </div>
            <div class="tab-item">
                <div class="tab-icon">👥</div>
                <div class="tab-text">学生</div>
            </div>
            <div class="tab-item">
                <div class="tab-icon">👤</div>
                <div class="tab-text">我的</div>
            </div>
        </div>
    </div>

    <script>
        // 添加页面交互效果
        document.addEventListener('DOMContentLoaded', function() {
            // 统计卡片点击效果
            const statCards = document.querySelectorAll('.stat-card');
            statCards.forEach(card => {
                card.addEventListener('click', function() {
                    const label = this.querySelector('.stat-label').textContent;
                    console.log('点击了:', label);
                });
            });

            // 快捷操作点击效果
            const actionItems = document.querySelectorAll('.action-item');
            actionItems.forEach(item => {
                item.addEventListener('click', function() {
                    const text = this.querySelector('.action-text').textContent;
                    console.log('点击了操作:', text);
                });
            });

            // 列表项点击效果
            const listItems = document.querySelectorAll('.list-item');
            listItems.forEach(item => {
                item.addEventListener('click', function() {
                    const title = this.querySelector('.list-title').textContent;
                    console.log('点击了列表项:', title);
                });
            });

            // 底部导航切换
            const tabItems = document.querySelectorAll('.tab-item');
            tabItems.forEach(item => {
                item.addEventListener('click', function() {
                    // 移除所有active类
                    tabItems.forEach(t => t.classList.remove('active'));
                    // 添加active类到当前项
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
